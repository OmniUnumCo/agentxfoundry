[package]
name = "rational-reserve"
version = "0.1.0"
description = "Military-hierarchy AI swarm orchestration — deterministic, compiled agents"
readme = "README.md"
license = "MIT"
edition = "2021"

[[bin]]
name = "rr-daemon"
path = "src/bin/rr_daemon.rs"

[[bin]]
name = "rr-mcp"
path = "src/bin/rr_mcp.rs"

[lib]
name = "rr"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
toml = "0.8"
async-trait = "0.1"
dirs = "5"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
